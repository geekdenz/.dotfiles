onboarding = false

[ui.sidebar.agents]
# Avante reports its active ACP backend through the optional $provider token.
# Other agents omit the token automatically.
rows = [["state_icon", "agent"], ["$provider"], ["workspace", "tab"]]

[ui.toast]
delivery = "herdr"

[theme]
name = "dracula"
auto_switch = false

# Herdr 0.8.2 uses the panel contrast color for active tabs and hovered
# context-menu entries. Keep panels on the terminal background and make that
# contrast color readable.
[theme.custom]
panel_bg = "reset"
surface_dim = "#ffffff"
