onboarding = false

[ui.sidebar.agents]
# Avante reports its active ACP backend through the optional $provider token.
# Other agents omit the token automatically.
rows = [["state_icon", "agent"], ["$provider"], ["workspace", "tab"]]

[ui.toast]
delivery = "herdr"

[theme]
name = "dracula"
auto_switch = false

# Herdr 0.8.2 uses the panel contrast color for active tabs and hovered
# context-menu entries. Keep panels on the terminal background, and keep that
# contrast color dark: tab labels are drawn in the theme's near-white text
# color, so a light surface here hides them.
[theme.custom]
panel_bg = "reset"
surface_dim = "#343746"
surface0 = "#44475a"
# Inactive tab labels are drawn in overlay0 on surface0. Dracula's comment blue
# (#6272a4) gives under 2:1 contrast there; this keeps them muted but legible.
overlay0 = "#c0c5e0"
