# CachyOS idle/lock/suspend configuration for hypridle.
# Documentation: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # Avoids starting a second hyprlock instance if one is already up.
    lock_cmd = pidof hyprlock || hyprlock
    # Fires on systemd-logind's PrepareForSleep signal, so it locks before
    # ANY suspend -- manual `systemctl suspend`, lid close, power button, or
    # the idle-triggered suspend below -- not just hypridle's own timers.
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
