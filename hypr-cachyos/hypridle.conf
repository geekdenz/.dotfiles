# Automatic screen lock/suspend so the session doesn't sit unlocked
# indefinitely if you walk away without pressing Super+Ctrl+L.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
}

listener {
    timeout = 300
    on-timeout = pidof hyprlock || hyprlock
}

# No DPMS off/on listener here: cycling display power on this NVIDIA
# system breaks Waybar's Wayland connection (Error 22, dispatching to
# Wayland display) and crashes it. The lock screen alone already hides
# all content, so this isn't a security gap, just a lost power saving.

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
