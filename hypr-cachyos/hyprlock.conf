# CachyOS lock screen. This file is discovered through ~/.config/hypr.

$font = Noto Sans

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = screenshot
    color = rgb(1a1b26)
    blur_passes = 3
    blur_size = 8
}

label {
    monitor =
    text = $TIME
    color = rgb(c0caf5)
    font_size = 86
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(a9b1d6)
    font_size = 20
    font_family = $font
    position = 0, 25
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 3
    rounding = 14

    inner_color = rgba(1a1b26dd)
    outer_color = rgba(7aa2f7ee)
    check_color = rgba(9ece6aee)
    fail_color = rgba(f7768eee)
    font_color = rgb(c0caf5)

    font_family = $font
    placeholder_text = Enter password...
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    fade_on_empty = false

    position = 0, -80
    halign = center
    valign = center
}
