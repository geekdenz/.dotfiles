# Force ssh-add/ssh/git to use the terminal-based masked-passphrase prompt
# in bin/ssh-askpass-tty instead of a GUI dialog (e.g. ksshaskpass) or
# ssh-add's own silent, echo-less prompt. SSH_ASKPASS_REQUIRE=force makes
# this apply even when a controlling terminal is present, so behavior stays
# the same everywhere: Hyprland, a plain terminal, or (if it still has one)
# a Plasma session.
SSH_ASKPASS=${HOME}/.local/bin/ssh-askpass-tty
SSH_ASKPASS_REQUIRE=force
GIT_ASKPASS=${HOME}/.local/bin/ssh-askpass-tty
